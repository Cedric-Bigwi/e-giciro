version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: e-giciro-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_STORAGE=./database/e_giciro.sqlite
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_string_before_deploying}
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost:5173
    volumes:
      - backend-db:/app/database
    command: npm start

  frontend:
    build:
      context: ./frontend
    container_name: e-giciro-frontend
    ports:
      - '5173:4173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    command: sh -c "npm run build && npm run preview -- --host --port 4173"

volumes:
  backend-db:
